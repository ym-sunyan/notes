<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-DOCTYPE和lang以及字符集的作用</title>
</head>

<body>
    无需再次观看该视频<br />
    html基本结构<br />
    !DOCTYPE html 表示是html 5 写的。必须在顶部<br />
    html lang="en" 表示文件语言是英文. en=英文。 zh-CN=中文<br />
    meta charset="UTF-8" <b>(必须要写在html里面)</b>表示编码集是使用utf-8的格式。utf-8万国码，基本包含了全世界的所有国家需要的字符<br />
</body>

</html>
